<!--
  Static prototype of drilling into a visit reason to pick the SOB line item and
  specialty to price. Everything is mocked in this file: the typeahead response,
  the copay results, and the provider locations. No backend is called.
  Styling mirrors the shopping-tool design tokens (app/globals.css).
-->
<style>
  :root {

    --grey-400: #898e99; --grey-500: #6b7280; --grey-600: #565b66; --grey-700: #40444d;

    --orange-50: #fff2ed; --orange-100: #ffe4db; --orange-200: #ffc9b8; --orange-700: #99472d; --orange-800: #66301f;
    --purple-100: #dadafa; --purple-200: #b6b6f5; --purple-500: #4848e6;
    --primary: #1d1d5c;

  }

  /* Typography (typo-* utilities) */

  @media (min-width: 640px) { .search-form { padding: 24px; } }
  @media (min-width: 1024px) { .search-form { display: grid; grid-template-columns: 1fr 1fr auto; align-items: start; } }

  @media (min-width: 1024px) { .trigger { font-size: 16px; } }

  /* Popover */

  .clear { margin-top: 10px; border-radius: 999px; padding: 2px; }

  /* Drill-down panels */
  .viewport { overflow: hidden; transition: height .3s ease-out; }

  .option { width: 100%; display: flex; align-items: flex-start; gap: 8px; padding: 6px 16px; outline: none; }
  .option:hover, .option:focus-visible { background: var(--grey-50); }
  .option[aria-selected="true"] { background: var(--accent); }
  .popular-option { width: calc(100% - 8px); margin: 0 4px; padding: 6px 12px; border-radius: 4px; font-size: 15px; line-height: 21px; }
  .popular-option:hover, .popular-option:focus-visible { background: var(--accent); }

  .sep { border: 0; border-top: 1px solid var(--grey-100); margin: 0; opacity: .6; }
  .badge { display: inline-flex; align-items: center; justify-content: center; width: 80px; flex-shrink: 0; border-radius: 999px; padding: 2px 8px; margin-top: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .badge.reason { background: var(--blue-100); color: var(--blue-700); }

  .empty { padding: 24px; text-align: center; font-size: 14px; }
  .loc-option { width: 100%; padding: 10px 16px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .loc-option:hover { background: var(--grey-50); }

  .loc-option[aria-selected="true"] .check { visibility: visible; }
  .zip-trigger { flex-direction: row; align-items: center; justify-content: space-between; }

  /* Popular */

  @media (min-width: 640px) { .popular { width: 100%; max-width: 40rem; padding: 0 20px; } }
  @media (min-width: 768px) { .popular { max-width: none; width: 940px; padding: 0; } }
  @media (min-width: 640px) { .popular { margin-top: 64px; } }
  .popular-grid { margin-top: 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px 0; }
  @media (min-width: 1024px) { .popular-grid { display: flex; justify-content: space-between; } }
  .popular-item { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100px; justify-self: center; }
  .popular-item .circle { width: 80px; height: 80px; border-radius: 999px; background: var(--grey-50); display: grid; place-items: center; }

  .results-list { overflow: auto; padding: 24px 20px 80px; order: 2; }

  #map { width: 100%; height: 100%; }

  .rcard { background: #fff; border-radius: 8px; border: 1px solid var(--gray-200); overflow: hidden; box-shadow: 0 1px 3px 0 rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1); }

  .doctor { position: relative; display: flex; align-items: center; width: 64px; height: 64px; flex-shrink: 0; }
  @media (min-width: 1024px) { .doctor { width: 75px; height: 75px; } }

  /* Dialog: components/ui/dialog + LockInCopayModal */
  body.modal-open { overflow: hidden; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .overlay { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.8); animation: fade-in .2s; }
  .dialog { position: fixed; left: 50%; top: 50%; z-index: 2001; transform: translate(-50%, -50%); display: grid; gap: 16px; width: 100%; max-width: min(calc(100vw - 32px), 500px); max-height: calc(100vh - 32px); overflow: auto; border-radius: 8px; border: 1px solid var(--gray-200); background: #fff; padding: 0 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1); animation: zoom-in .2s; }
  @keyframes fade-in { from { opacity: 0; } }

  .lock-v2 { position: relative; margin: 0 -20px; }

  .lock-head p { margin: 4px 0 0; font-size: 14px; line-height: 20px; color: var(--gray-500); }
  .lock-provider { padding: 16px 24px; border-bottom: 1px solid var(--gray-100); }
  .lock-provider h3 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 500; color: var(--gray-900); }
  .lock-addr { display: flex; align-items: center; gap: 8px; }
  .lock-addr .pin-icon { margin-right: 4px; }
  .lock-addr p { margin: 4px 0 0; font-size: 14px; line-height: 20px; color: var(--gray-600); }
  .lock-amount { margin-left: 16px; text-align: right; font-size: 24px; line-height: 32px; font-weight: 700; color: var(--grey-700); }
  .lock-amount.top { color: var(--green-600); }

/** A visit reason's specialty / SOB line item rows, least acute care first. */
function sortedCombos(visitReason) {

/* ---------------------------------------------------- mock typeahead API */
const words = (value) => value.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean)
const CANDIDATES = [

    result: { variant: 'visitReasonResult', id: visitReason.id, visitReason },
    words: [...words(visitReason.name), ...visitReason.terms],
  })),
  ...LINE_ITEMS.map((entry) => ({
    result: { variant: 'lineItemResult', id: entry.id, entry },
    words: [...entry.specialties.flatMap((s) => words(s.name)), ...entry.terms],
  })),
].map((candidate, index) => ({
  ...candidate,
  // The specialty row sits under the best visit reason, as in the real typeahead.
  order: candidate.result.id === 'li-ortho-hip-knee' ? 0.5 : index,
}))

function mockSearch(query) {
  return new Promise((resolve) => {
    setTimeout(() => {
      const tokens = words(query)
      const ranked = CANDIDATES.map((c) => ({ ...c, score: tokens.filter((t) => c.words.some((w) => w.startsWith(t))).length }))
        .filter((c) => c.score > 0)
        .sort((a, b) => b.score - a.score || a.order - b.order)
      resolve(ranked.slice(0, 10).map((c) => c.result))
    }, 450)
  })
}

const FIRST_NAMES = ['Sarah', 'Michael', 'Priya', 'David', 'Emily', 'James', 'Laura', 'Daniel', 'Megan', 'Andrew', 'Rachel', 'Kevin']
const LAST_NAMES = ['Hartman', 'Okafor', 'Lindqvist', 'Ramirez', 'Schultz', 'Nguyen', 'Kowalski', 'Brennan', 'Patel', 'Becker', 'Morrison', 'Thao']
const DEGREES = { specialist: 'MD', primaryCare: 'MD', mentalHealth: 'LPC', physicalTherapy: 'PT, DPT', chiropractic: 'DC' }

/** Stable hash, so the same search always looks the same. */
function hash(value) {
  let h = 2166136261
  for (let i = 0; i < value.length; i++) {
    h ^= value.charCodeAt(i)
    h = Math.imul(h, 16777619)
  }
  return Math.abs(h)
}
function miles(a, b) {
  const toRad = (d) => (d * Math.PI) / 180
  const dLat = toRad(b.lat - a.lat)
  const dLng = toRad(b.lng - a.lng)
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2
  return 3958.8 * 2 * Math.asin(Math.sqrt(h))
}

/** Prices each (specialty, SOB line item) row at up to two nearby locations. */
function mockCopaySearch(selection, member) {
  return new Promise((resolve) => {
    setTimeout(() => {
      const results = new Map()
      for (const { specialty, sobLineItem } of selection.combos) {
        const candidates = LOCATIONS.filter((l) => l.kinds.includes(sobLineItem.kind))
        const offset = hash(specialty.id) % Math.max(candidates.length, 1)
        const picked = [...candidates.slice(offset), ...candidates.slice(0, offset)].slice(0, 3)
        for (const location of picked) {
          const key = `${specialty.id}|${sobLineItem.id}|${location.id}`
          const seed = hash(key)
          const locationOnly = LOCATION_ONLY_KINDS.includes(sobLineItem.kind)
          results.set(key, {
            id: `copay-${seed.toString(36)}`,
            amount: COPAY_BY_KIND[sobLineItem.kind] + (seed % 3 === 0 ? 10 : 0),
            location,
            distance: miles(member, location),
            sobLineItem,
            specialty,
            locationOnly,
            priorAuthRequired: PRIOR_AUTH_KINDS.includes(sobLineItem.kind),
            provider: locationOnly
              ? null
              : {
                  name: `${FIRST_NAMES[seed % FIRST_NAMES.length]} ${LAST_NAMES[(seed >> 4) % LAST_NAMES.length]}`,
                  degrees: DEGREES[sobLineItem.kind] ?? 'MD',
                  // FIRST_NAMES alternates female, male.
                  gender: seed % 2 === 0 ? 'female' : 'male',
                },
          })
        }
      }
      const sorted = [...results.values()].sort((a, b) => a.distance - b.distance)
      sorted.forEach((r, i) => { r.topChoice = i < 2 })
      resolve(sorted)
    }, 900)
  })
}

function renderResultsPanel() {

function panelHead({ back, eyebrow, title, desc }) {

}

function renderVisitReasonPanel(visitReason) {

        .map((c) =>

}

function renderLevel(level) {
  if (level.kind === 'results') return renderResultsPanel()
  return renderVisitReasonPanel(level.visitReason)
}

const panels = () => [...els.track.children]

function syncPanels() {
  panels().forEach((panel, i) => {
    panel.inert = i !== combo.depth
    panel.setAttribute('aria-hidden', String(i !== combo.depth))
  })
  els.track.style.transform = `translateX(-${combo.depth * 100}%)`
  updateHeight()
}

function updateHeight() {
  const active = panels()[combo.depth]
  if (active) els.viewport.style.height = `${active.offsetHeight}px`
}

/** Re-renders every panel in place, with no slide. */
function renderAllPanels() {
  els.track.classList.add('no-anim')
  els.viewport.classList.add('no-anim')
  els.track.innerHTML = combo.levels.map((level) => `<div class="panel">${renderLevel(level)}</div>`).join('')
  syncPanels()
  void els.track.offsetWidth
  els.track.classList.remove('no-anim')
  els.viewport.classList.remove('no-anim')
}

function rerenderPanel(index) {
  const panel = panels()[index]
  if (!panel) return
  panel.innerHTML = renderLevel(combo.levels[index])
  if (index === combo.depth) updateHeight()
}

function drill(level) {
  for (const extra of panels().slice(combo.depth + 1)) extra.remove()
  combo.levels = [...combo.levels.slice(0, combo.depth + 1), level]
  els.track.insertAdjacentHTML('beforeend', `<div class="panel">${renderLevel(level)}</div>`)
  void els.track.offsetWidth
  combo.depth += 1
  syncPanels()
}

function back() {
  if (combo.depth === 0) return
  combo.depth -= 1
  syncPanels()
}

els.track.addEventListener('transitionend', (e) => {
  if (e.target !== els.track || e.propertyName !== 'transform') return
  for (const extra of panels().slice(combo.depth + 1)) extra.remove()
  combo.levels = combo.levels.slice(0, combo.depth + 1)
  if (combo.depth === 0) els.query.focus({ preventScroll: true })
  else panels()[combo.depth]?.querySelector('[data-option]')?.focus({ preventScroll: true })
})

function runSearch() {
  const query = combo.query
  clearTimeout(combo.debounce)
  els.clear.hidden = !query
  if (!query.trim()) {
    combo.results = []
    combo.loading = false
    rerenderPanel(0)
    return
  }
  combo.loading = true
  rerenderPanel(0)
  const requestId = ++combo.requestId
  combo.debounce = setTimeout(async () => {
    const results = await mockSearch(query)
    if (requestId !== combo.requestId) return
    combo.results = results
    combo.loading = false
    rerenderPanel(0)
  }, 150)
}

function resetToRoot() {
  combo.levels = [{ kind: 'results' }]
  combo.depth = 0
  renderAllPanels()
}

function openCombo() {
  closeZip()
  combo.open = true
  // Reopening a drilled-in choice lands back on its visit reason, so the member
  // can switch to a different specialty in one click.
  const visitReason = state.selection?.visitReason
  combo.levels = visitReason ? [{ kind: 'results' }, { kind: 'reason', visitReason }] : [{ kind: 'results' }]
  combo.depth = combo.levels.length - 1
  if (visitReason && !combo.query) {
    combo.query = visitReason.name
    els.query.value = combo.query
    runSearch()
  }
  els.popover.hidden = false
  els.trigger.setAttribute('aria-expanded', 'true')
  renderAllPanels()
  requestAnimationFrame(() => {
    if (combo.depth === 0) {
      els.query.focus()
      els.query.setSelectionRange(0, els.query.value.length, 'forward')
    } else {
      panels()[combo.depth]?.querySelector('[data-option]')?.focus({ preventScroll: true })
    }
  })
}

function closeCombo() {
  combo.open = false
  els.popover.hidden = true
  els.trigger.setAttribute('aria-expanded', 'false')
}

function choose(selection) {
  state.selection = selection
  renderTrigger()
  closeCombo()
  els.trigger.focus()
}

els.trigger.addEventListener('click', () => (combo.open ? closeCombo() : openCombo()))
els.query.addEventListener('input', () => {
  combo.query = els.query.value
  if (combo.depth !== 0 || combo.levels.length > 1) resetToRoot()
  runSearch()
})
els.query.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') e.preventDefault()
  if (e.key === 'ArrowDown') {
    e.preventDefault()
    panels()[combo.depth]?.querySelector('[data-option]')?.focus()
  }
})
els.clear.addEventListener('click', () => {
  combo.query = ''
  els.query.value = ''
  resetToRoot()
  runSearch()
  els.query.focus()
})

els.track.addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]')
  if (!target) return
  const level = combo.levels[combo.depth]
  const id = target.dataset.id
  switch (target.dataset.action) {
    case 'back':
      return back()
    case 'drill-reason':
      return drill({ kind: 'reason', visitReason: VISIT_REASONS.find((v) => v.id === id) })
    case 'select-popular':
      return choose(selectLineItem(POPULAR.find((p) => p.id === id)))
    case 'select-line-item': {
      const entry = LINE_ITEMS.find((l) => l.id === id)
      return choose(selectLineItem(entry))
    }
    case 'select-combo': {
      const row = level.visitReason.combos.find((c) => comboId(level.visitReason, c) === id)
      return choose(selectCombo(level.visitReason, row))
    }
  }
})

els.track.addEventListener('keydown', (e) => {
  const target = e.target
  if (!target.matches('[data-option]')) return
  const options = [...panels()[combo.depth].querySelectorAll('[data-option]')]
  const index = options.indexOf(target)
  if (e.key === 'ArrowDown') {
    e.preventDefault()
    options[Math.min(index + 1, options.length - 1)]?.focus()
  } else if (e.key === 'ArrowUp') {
    e.preventDefault()
    if (index === 0 && combo.depth === 0) els.query.focus()
    else options[Math.max(index - 1, 0)]?.focus()
  } else if (e.key === 'ArrowRight' && target.dataset.drillable) {
    e.preventDefault()
    target.click()
  } else if ((e.key === 'ArrowLeft' || e.key === 'Backspace') && combo.depth > 0) {
    e.preventDefault()
    back()
  }
})

/* -------------------------------------------------------- location picker */
function renderZip() {
  els.zipTrigger.innerHTML = `<span>${esc(state.location?.label ?? 'Zip Code')}</span>${icon('chevronsUpDown')}`
  els.zipPopover.innerHTML = MEMBER_LOCATIONS.map(
    (loc) => `<button type="button" class="loc-option" data-zip="${loc.zip}" aria-selected="${loc.zip === state.location?.zip}">
        ${icon('check', 'check')}<span>${esc(loc.label)}</span></button>`,
  ).join('')
}
function closeZip() {
  els.zipPopover.hidden = true
  els.zipTrigger.setAttribute('aria-expanded', 'false')
}
els.zipTrigger.addEventListener('click', () => {
  const opening = els.zipPopover.hidden
  closeCombo()
  els.zipPopover.hidden = !opening
  els.zipTrigger.setAttribute('aria-expanded', String(opening))
})
els.zipPopover.addEventListener('click', (e) => {
  const option = e.target.closest('[data-zip]')
  if (!option) return
  state.location = MEMBER_LOCATIONS.find((l) => l.zip === option.dataset.zip)
  renderZip()
  closeZip()
  renderTrigger()
})

document.addEventListener('mousedown', (e) => {
  if (combo.open && !els.field.contains(e.target)) closeCombo()
  if (!els.zipPopover.hidden && !els.zipField.contains(e.target)) closeZip()
})
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return
  if (combo.open) {
    closeCombo()
    els.trigger.focus()
  }
  closeZip()
})

  lock.result = state.results.find((r) => r.id === resultId)
  lock.step = 'details'
  lock.submitting = false
  lock.opener = opener
  renderLockIn()
  $('lock-modal').hidden = false
  document.body.classList.add('modal-open')
  $('lock-dialog').querySelector('[data-lock-close]').focus()
}

function closeLockIn() {
  $('lock-modal').hidden = true
  document.body.classList.remove('modal-open')
  lock.opener?.focus()
}

async function submitLockIn() {
  lock.submitting = true
  const button = $('lock-dialog').querySelector('[data-lock-submit]')
  button.disabled = true
  button.innerHTML = `<span class="invisible">${lockInLabel(lock.result)}</span>${icon('loaderCircle', 'spin')}`
  await new Promise((resolve) => setTimeout(resolve, 800))
  if ($('lock-modal').hidden) return
  lock.submitting = false
  lock.step = 'success'
  renderLockIn()
  $('lock-dialog').querySelector('[data-lock-close]').focus()
}

els.resultsList.addEventListener('click', (e) => {
  const button = e.target.closest('[data-lock-in]')
  if (button) openLockIn(button.dataset.lockIn, button)
})
$('lock-modal').addEventListener('click', (e) => {
  if (e.target.closest('[data-lock-close]') || e.target.classList.contains('overlay')) return closeLockIn()
  if (e.target.closest('[data-lock-submit]')) return submitLockIn()
  const trigger = e.target.closest('.acc-trigger')
  if (trigger) {
    const open = trigger.getAttribute('aria-expanded') !== 'true'
    trigger.setAttribute('aria-expanded', String(open))
    $(trigger.getAttribute('aria-controls')).hidden = !open
  }
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('lock-modal').hidden) closeLockIn()
})

function renderResults() {
  const { selection, location, results } = state
  els.resultsList.innerHTML = `
    <nav class="crumbs" aria-label="Breadcrumb">
      <button type="button" data-nav="home">Home</button>${icon('chevronRight')}
      <span class="current">${esc(`${selection.title} - ${location.zip}`)}</span>
    </nav>
    ${summaryHtml()}
    ${
      results === null
        ? `<div style="display:flex;flex-direction:column;gap:20px;padding-top:32px">
            <div class="skeleton" style="height:24px;width:260px"></div>
            ${'<div class="skeleton" style="height:208px;border-radius:8px"></div>'.repeat(4)}</div>`
        : `<div class="count">
            <p class="typo-subtitle-1">Showing ${results.length} of ${results.length} Available Options</p>
            <p class="typo-body-1 muted">Results sorted by highest quality and nearest to your location.</p>
          </div>
          <ul class="cards">${results.map(cardHtml).join('')}</ul>
          <p class="end typo-body-2">You've reached the end of the results.</p>`
    }`
  renderMap()
}

function renderMap() {
  if (!window.L) return
  // A fresh map per render: a reused one keeps a stale size and center from
  // while its container was hidden on the search view.
  map?.remove()
  markers.clear()
  map = L.map('map', { zoomControl: true }).setView([state.location.lat, state.location.lng], 11)
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  }).addTo(map)
  const member = L.circleMarker([state.location.lat, state.location.lng], {
    radius: 7, color: '#fff', weight: 3, fillColor: '#1d4ed8', fillOpacity: 1,
  }).bindTooltip('Your location')
  member.addTo(map)
  markers.set('__member', member)
  if (!state.results) {
    map.setView([state.location.lat, state.location.lng], 11)
    return
  }
  const byLocation = new Map()
  for (const r of state.results) {
    if (!byLocation.has(r.location.id)) byLocation.set(r.location.id, [])
    byLocation.get(r.location.id).push(r)
  }
  const bounds = L.latLngBounds([[state.location.lat, state.location.lng]])
  for (const [locationId, group] of byLocation) {
    const lowest = Math.min(...group.map((r) => r.amount))
    const { lat, lng, name } = group[0].location
    const marker = L.marker([lat, lng], {
      icon: L.divIcon({
        className: 'pin-wrap',
        iconSize: [0, 0],
        html: `<button type="button" class="pin" data-pin="${locationId}" aria-label="${esc(name)}">$${lowest}${group.length > 1 ? '+' : ''}</button>`,
      }),
      keyboard: false,
    })
    marker.on('click', () => {
      setActiveLocation(locationId)
      scrollToResult(group[0].id)
    })
    marker.addTo(map)
    markers.set(locationId, marker)
    bounds.extend([lat, lng])
  }
  map.fitBounds(bounds, { padding: [50, 50], maxZoom: 13 })
}

/** Scrolls only the list, so the page itself never slides under the header. */
function scrollToResult(id) {
  const item = document.getElementById(`result-${id}`)
  if (!item) return
  const list = els.resultsList
  if (list.scrollHeight > list.clientHeight) {
    const top = item.getBoundingClientRect().top - list.getBoundingClientRect().top + list.scrollTop - 16
    list.scrollTo({ top, behavior: 'smooth' })
  } else {
    const header = document.querySelector('.header').offsetHeight
    window.scrollTo({ top: item.getBoundingClientRect().top + window.scrollY - header - 16, behavior: 'smooth' })
  }
}

function setActiveLocation(locationId, { pan = false } = {}) {
  state.activeLocationId = locationId
  document.querySelectorAll('.cards li').forEach((li) => {
    li.querySelector('.rcard').classList.toggle('active', li.dataset.location === locationId)
  })
  document.querySelectorAll('.pin').forEach((pin) => pin.classList.toggle('active', pin.dataset.pin === locationId))
  const marker = markers.get(locationId)
  if (marker) {
    marker.setZIndexOffset(1000)
    if (pan && !map.getBounds().contains(marker.getLatLng())) map.panTo(marker.getLatLng())
  }
}

els.resultsList.addEventListener('mouseover', (e) => {
  const li = e.target.closest('.cards li')
  if (li && li.dataset.location !== state.activeLocationId) setActiveLocation(li.dataset.location, { pan: true })
})
els.resultsList.addEventListener('mouseleave', () => setActiveLocation(null))

document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-nav]')
  if (!nav) return
  if (nav.dataset.nav === 'home') showSearch()
})

els.form.addEventListener('submit', (e) => {
  e.preventDefault()
  runCopaySearch()
})

/* ------------------------------------------------------------------- init */
$('popular').innerHTML = [
  ['primary-care', 'Primary Care'], ['pediatrics', 'Pediatrics'], ['cardiology', 'Cardiology'],
  ['neurology', 'Neurology'], ['ent', 'ENT'], ['mental-health', 'Mental Health'],
]
  .map(([file, label]) => `<div class="popular-item"><div class="circle"><img src="assets/${file}.svg" alt="" /></div><p class="typo-body-1">${label}</p></div>`)
  .join('')
renderTrigger()
renderZip()
renderAllPanels()
</script>
